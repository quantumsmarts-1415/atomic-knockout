<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Controller — Atomic Knockout</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #060a10; color: #d8ecff;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #142033 0%, #060a10 62%);
  }

  #join {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 18px; padding: 20px; box-sizing: border-box; text-align: center;
  }
  #join h2 { margin: 0; font-weight: 300; letter-spacing: 0.06em; font-size: 22px; }
  .ring {
    width: 76px; height: 76px; border-radius: 50%; border: 1px solid #4ad6ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 0.12em; color: #4ad6ff;
    box-shadow: 0 0 22px rgba(74, 214, 255, 0.35);
  }
  #join input {
    font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 2px;
    border: 1px solid rgba(74, 214, 255, 0.5); background: rgba(255,255,255,0.03);
    color: #eaf9ff; width: 220px; text-align: center; letter-spacing: 0.04em;
  }
  #join input::placeholder { color: #5c7a94; }
  #join button {
    font: inherit; font-size: 14px; padding: 13px 32px; border-radius: 2px;
    border: 1px solid #4ad6ff; background: rgba(74, 214, 255, 0.12); color: #eaf9ff;
    letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
  }
  #status { color: #5c7a94; font-size: 13px; min-height: 18px; letter-spacing: 0.02em; }

  #controls { display: none; height: 100%; flex-direction: column; box-sizing: border-box; }
  #controls.active { display: flex; }
  #label {
    text-align: center; padding: 18px 12px 8px;
  }
  #label .eyebrow { font-size: 11px; letter-spacing: 0.22em; color: #4ad6ff; text-transform: uppercase; }
  #label .name { font-size: 20px; font-weight: 300; letter-spacing: 0.04em; margin-top: 4px; }

  #pad { flex: 1; display: flex; padding: 0 14px 22px; gap: 12px; }
  .side {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center;
  }

  /* --- d-pad: a real cross/plus grid, not stacked flex rows.
     Each direction owns a fixed, non-overlapping grid cell, so it can never
     get covered by its neighbors regardless of viewport height (this is the
     fix for the down-arrow-overlap bug in the old stacked-rows layout). */
  .dpad-grid {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px 70px;
    gap: 8px;
  }
  .dpad-grid [data-btn="up"]    { grid-column: 2; grid-row: 1; }
  .dpad-grid [data-btn="left"]  { grid-column: 1; grid-row: 2; }
  .dpad-grid [data-btn="right"] { grid-column: 3; grid-row: 2; }
  .dpad-grid [data-btn="down"]  { grid-column: 2; grid-row: 3; }

  .btn {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.035); border: 1px solid rgba(74,214,255,0.35);
    border-radius: 4px; color: #bfe6ff; font-size: 22px;
  }
  .btn.pressed { background: rgba(74,214,255,0.2); box-shadow: 0 0 18px rgba(74,214,255,0.55); }

  #actions { gap: 18px; }
  #back, #confirm {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: #d8ecff; font-weight: 300;
  }
  #back {
    width: 82px; height: 82px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(216,236,255,0.4);
    font-size: 12px; letter-spacing: 0.12em;
  }
  #back.pressed { background: rgba(216,236,255,0.16); }
  #confirm {
    width: 128px; height: 128px;
    background: rgba(74,214,255,0.06); border: 1px solid #4ad6ff;
    font-size: 15px; letter-spacing: 0.14em;
  }
  #confirm.pressed { background: rgba(74,214,255,0.24); box-shadow: 0 0 26px rgba(74,214,255,0.6); }
</style>
</head>
<body>
  <div id="join">
    <div class="ring">ID</div>
    <h2>Join the fight</h2>
    <div id="status">Enter your callsign and join over the same WiFi as the game.</div>
    <input id="name" maxlength="16" placeholder="Callsign" />
    <button id="joinBtn">Connect</button>
  </div>

  <div id="controls">
    <div id="label">
      <div class="eyebrow">Assigned</div>
      <div class="name" id="labelName"></div>
    </div>
    <div id="pad">
      <div class="side">
        <div class="dpad-grid">
          <div class="btn" data-btn="up">&#9650;</div>
          <div class="btn" data-btn="left">&#9664;</div>
          <div class="btn" data-btn="right">&#9654;</div>
          <div class="btn" data-btn="down">&#9660;</div>
        </div>
      </div>
      <div class="side" id="actions">
        <div id="back" data-btn="back">SPECIAL</div>
        <div id="confirm" data-btn="confirm">ATTACK</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const joinEl = document.getElementById('join');
      const controlsEl = document.getElementById('controls');
      const statusEl = document.getElementById('status');
      const labelEl = document.getElementById('labelName');
      const nameInput = document.getElementById('name');
      const joinBtn = document.getElementById('joinBtn');

      let ws = null;
      const state = { left: false, right: false, up: false, down: false, confirm: false, back: false };

      function send() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(Object.assign({ type: 'input' }, state)));
        }
      }

      function bindButton(el) {
        const key = el.dataset.btn;
        const press = (e) => { e.preventDefault(); state[key] = true; el.classList.add('pressed'); send(); };
        const release = (e) => { e.preventDefault(); state[key] = false; el.classList.remove('pressed'); send(); };
        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('pointerleave', release);
      }
      document.querySelectorAll('[data-btn]').forEach(bindButton);

      function connect() {
        statusEl.textContent = 'Connecting…';
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const name = encodeURIComponent(nameInput.value.trim().slice(0, 16));
        ws = new WebSocket(`${proto}://${location.host}/ws?role=controller&name=${name}`);

        ws.onopen = () => { statusEl.textContent = 'Connected — waiting for the game…'; };

        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'assigned') {
            joinEl.style.display = 'none';
            controlsEl.classList.add('active');
            labelEl.textContent = msg.label;
          } else if (msg.type === 'full') {
            statusEl.textContent = 'Lobby is full (6 players max). Try again later.';
          }
        };

        ws.onclose = () => {
          const wasPlaying = controlsEl.classList.contains('active');
          controlsEl.classList.remove('active');
          joinEl.style.display = 'flex';
          statusEl.textContent = wasPlaying
            ? 'Disconnected — tap Connect to reconnect.'
            : 'Could not connect. Tap Connect to retry.';
        };
      }

      joinBtn.addEventListener('click', connect);
    })();
  </script>
</body>
</html>
