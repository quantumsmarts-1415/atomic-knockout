# Manual production publish only. Do not enable automatic deploys,
# deploy previews, or branch deploys in the Netlify UI.
# `true` exits 0, which tells Netlify to stop before the build runs,
# so those contexts do not spend build minutes.
# Keyboard and gamepad play from this static site.
# Phone controllers still need the Node relay: `npm run dev`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"

[[redirects]]
  from = "/fx-index"
  to = "/fx-index.json"
  status = 200
