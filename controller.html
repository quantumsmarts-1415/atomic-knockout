<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Controller — Atomic Knockout</title>
<style>
  @font-face {
    font-family: Sora;
    src: url("/fonts/sora-400.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: Sora;
    src: url("/fonts/sora-600.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --cyan: #3EF0E0; --pink: #FF4FA3; --violet: #8A6CFF; --ink: #E8F6FF; --dim: #9A91B0;
    --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #07060E; color: var(--ink);
    font-family: Sora, "Segoe UI", sans-serif;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(60% 50% at 18% 70%, rgba(62,240,224,0.10) 0%, transparent 70%),
      radial-gradient(55% 50% at 85% 65%, rgba(255,79,163,0.12) 0%, transparent 70%),
      radial-gradient(120% 90% at 50% 0%, #2A1848 0%, #07060E 62%);
  }
  /* faint grid floor + atom watermark */
  #bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #bg::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(62,240,224,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(62,240,224,0.06) 1px, transparent 1px);
    background-size: 36px 36px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 55%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 55%, #000 100%);
  }
  #bg svg { position: absolute; left: 50%; top: 50%; width: 120vmin; height: 120vmin;
    transform: translate(-50%, -50%); opacity: 0.09; }
  #bg svg .orbit { animation: spin 28s linear infinite; transform-origin: 50% 50%; }
  #bg svg .orbit.o2 { animation-duration: 36s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #join, #controls { position: relative; z-index: 1; }
  #join {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 16px; padding: 20px; box-sizing: border-box; text-align: center;
  }
  #join h2 { margin: 0; font-weight: 600; letter-spacing: 0.08em; font-size: 24px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--cyan), #fff 50%, var(--pink)); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .ring {
    width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--cyan);
    display: flex; align-items: center; justify-content: center; position: relative;
    font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: var(--cyan);
    box-shadow: 0 0 26px rgba(62,240,224,0.45), inset 0 0 18px rgba(62,240,224,0.25);
  }
  .ring::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
    border: 1px dashed rgba(255,79,163,0.55); animation: spin 14s linear infinite; }
  #join input {
    font: inherit; font-size: 16px; padding: 12px 16px; border-radius: 999px;
    border: 1px solid rgba(62,240,224,0.6); background: rgba(20,14,40,0.7);
    color: var(--ink); width: 230px; text-align: center; letter-spacing: 0.05em; outline: none;
  }
  #join input:focus { box-shadow: 0 0 0 3px rgba(62,240,224,0.25); }
  #join input::placeholder { color: var(--dim); }
  #join button {
    font: inherit; font-size: 15px; font-weight: 600; padding: 14px 40px; border-radius: 999px; border: 0;
    background: linear-gradient(90deg, var(--cyan), var(--violet) 60%, var(--pink)); color: #0A0716;
    letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 0 24px rgba(255,79,163,0.4), 0 0 24px rgba(62,240,224,0.35);
  }
  #status { color: var(--dim); font-size: 13px; min-height: 18px; letter-spacing: 0.02em; max-width: 300px; }

  #controls { display: none; height: 100%; flex-direction: column; box-sizing: border-box;
    padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l); }
  #controls.active { display: flex; }
  #label { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 12px 4px; }
  #label .chip { display: inline-flex; align-items: center; gap: 10px; padding: 7px 18px 7px 10px;
    border-radius: 999px; background: rgba(20,14,40,0.72); border: 1px solid rgba(62,240,224,0.45);
    box-shadow: 0 0 16px rgba(62,240,224,0.18); }
  #label .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  #label .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.22em; color: var(--cyan); text-transform: uppercase; }
  #label .name { font-size: 17px; font-weight: 600; letter-spacing: 0.05em; }

  #pad { flex: 1; display: flex; padding: 6px 18px 22px; gap: 12px; min-height: 0; }
  .side { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }

  /* --- analog joystick --- */
  #stick {
    --size: min(46vmin, 210px);
    width: var(--size); height: var(--size); border-radius: 50%; position: relative; touch-action: none;
    background:
      radial-gradient(circle at 50% 50%, rgba(62,240,224,0.10) 0%, rgba(20,14,40,0.85) 62%, rgba(10,7,22,0.95) 100%);
    border: 2px solid rgba(62,240,224,0.6);
    box-shadow: 0 0 28px rgba(62,240,224,0.25), inset 0 0 30px rgba(0,0,0,0.6), inset 0 0 0 10px rgba(62,240,224,0.04);
  }
  #stick::before { /* dead-zone ring */
    content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%;
    transform: translate(-50%,-50%); border-radius: 50%; border: 1px dashed rgba(62,240,224,0.28);
  }
  #stick .tick { position: absolute; width: 0; height: 0; border: 7px solid transparent; opacity: 0.55; transition: opacity .08s, filter .08s; }
  #stick .tick.up    { top: 8px; left: 50%; transform: translateX(-50%); border-bottom: 10px solid var(--cyan); border-top: 0; }
  #stick .tick.down  { bottom: 8px; left: 50%; transform: translateX(-50%); border-top: 10px solid var(--cyan); border-bottom: 0; }
  #stick .tick.left  { left: 8px; top: 50%; transform: translateY(-50%); border-right: 10px solid var(--cyan); border-left: 0; }
  #stick .tick.right { right: 8px; top: 50%; transform: translateY(-50%); border-left: 10px solid var(--cyan); border-right: 0; }
  #stick .tick.on { opacity: 1; filter: drop-shadow(0 0 6px var(--cyan)); }
  #stick .lbl { position: absolute; font-size: 9px; font-weight: 600; letter-spacing: 0.18em; color: rgba(232,246,255,0.55); }
  #stick .lbl.up { top: 22px; left: 50%; transform: translateX(-50%); }
  #stick .lbl.down { bottom: 22px; left: 50%; transform: translateX(-50%); }
  #knob {
    --k: 42%;
    position: absolute; left: 50%; top: 50%; width: var(--k); height: var(--k); border-radius: 50%;
    transform: translate(-50%,-50%); will-change: transform;
    background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #9FFCF2 18%, var(--cyan) 45%, #1B7F86 100%);
    box-shadow: 0 0 22px rgba(62,240,224,0.65), 0 6px 14px rgba(0,0,0,0.55), inset 0 -6px 12px rgba(0,0,0,0.3);
    transition: transform 0.14s cubic-bezier(.3,1.6,.5,1);
  }
  #knob::after { content: ""; position: absolute; inset: 28%; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.55); }
  #stick.active #knob { transition: none; box-shadow: 0 0 34px rgba(62,240,224,0.95), 0 6px 14px rgba(0,0,0,0.55); }
  #stick.active { border-color: var(--cyan); }

  /* --- action buttons --- */
  #actions { flex-direction: row; gap: 18px; align-items: center; }
  .act {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border-radius: 50%; color: var(--ink); font-weight: 600; touch-action: none; position: relative;
    transition: transform .06s, box-shadow .06s;
  }
  .act .glyph { font-size: 1.9em; line-height: 1; }
  .act .txt { font-size: 11px; letter-spacing: 0.18em; }
  #back {
    width: min(26vmin, 104px); height: min(26vmin, 104px); align-self: flex-start; margin-top: 4vmin;
    background: radial-gradient(circle at 35% 30%, rgba(255,140,200,0.55), rgba(255,79,163,0.25) 45%, rgba(40,10,40,0.85) 100%);
    border: 2px solid var(--pink); font-size: 14px;
    box-shadow: 0 0 22px rgba(255,79,163,0.45), inset 0 -6px 14px rgba(0,0,0,0.45);
  }
  #confirm {
    width: min(38vmin, 150px); height: min(38vmin, 150px); align-self: flex-end;
    background: radial-gradient(circle at 35% 30%, rgba(160,255,245,0.6), rgba(62,240,224,0.28) 45%, rgba(8,30,40,0.88) 100%);
    border: 2px solid var(--cyan); font-size: 18px;
    box-shadow: 0 0 28px rgba(62,240,224,0.5), inset 0 -8px 16px rgba(0,0,0,0.45);
  }
  .act.pressed { transform: scale(0.92); }
  #back.pressed { box-shadow: 0 0 40px rgba(255,79,163,0.95), inset 0 0 24px rgba(255,79,163,0.6); }
  #confirm.pressed { box-shadow: 0 0 46px rgba(62,240,224,0.95), inset 0 0 26px rgba(62,240,224,0.6); }

  /* portrait: stack stick over buttons */
  @media (orientation: portrait) {
    #pad { flex-direction: column; padding-bottom: calc(26px + var(--safe-b)); }
    #stick { --size: min(62vw, 250px); }
    #back { width: min(28vw, 110px); height: min(28vw, 110px); }
    #confirm { width: min(40vw, 160px); height: min(40vw, 160px); }
    #rotate { display: block; }
  }
  #rotate { display: none; text-align: center; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; padding-bottom: 6px; }
</style>
</head>
<body>
  <div id="bg">
    <svg viewBox="0 0 200 200" fill="none" stroke="#3EF0E0" stroke-width="1.2">
      <g class="orbit"><ellipse cx="100" cy="100" rx="90" ry="34"/><ellipse cx="100" cy="100" rx="90" ry="34" transform="rotate(60 100 100)"/></g>
      <g class="orbit o2"><ellipse cx="100" cy="100" rx="90" ry="34" transform="rotate(120 100 100)" stroke="#FF4FA3"/></g>
      <circle cx="100" cy="100" r="9" fill="#3EF0E0" stroke="none"/>
    </svg>
  </div>
  <div id="join">
    <div class="ring">ID</div>
    <h2>Join the fight</h2>
    <div id="status">Enter your callsign and join over the same WiFi as the game.</div>
    <input id="name" maxlength="16" placeholder="Callsign" />
    <button id="joinBtn">Connect</button>
  </div>

  <div id="controls">
    <div id="label">
      <div class="chip"><span class="dot"></span><span class="eyebrow">Player</span><span class="name" id="labelName"></span></div>
    </div>
    <div id="pad">
      <div class="side">
        <div id="stick" aria-label="Movement joystick">
          <span class="tick up"></span><span class="tick down"></span><span class="tick left"></span><span class="tick right"></span>
          <span class="lbl up">JUMP</span><span class="lbl down">CROUCH</span>
          <div id="knob"></div>
        </div>
      </div>
      <div class="side" id="actions">
        <div id="back" class="act" data-btn="back"><span class="glyph">&#10022;</span><span class="txt">SPECIAL</span></div>
        <div id="confirm" class="act" data-btn="confirm"><span class="glyph">&#9889;</span><span class="txt">ATTACK</span></div>
      </div>
    </div>
    <div id="rotate">Tip: turn your phone sideways for a wider grip</div>
  </div>

  <script>
    (function () {
      const joinEl = document.getElementById('join');
      const controlsEl = document.getElementById('controls');
      const statusEl = document.getElementById('status');
      const labelEl = document.getElementById('labelName');
      const nameInput = document.getElementById('name');
      const joinBtn = document.getElementById('joinBtn');

      let ws = null;
      // Booleans are the protocol the game reads; ax/ay (-1..1, +y = down)
      // are an optional analog extra that older hosts simply ignore.
      const state = { left: false, right: false, up: false, down: false, confirm: false, back: false, ax: 0, ay: 0 };

      function send() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(Object.assign({ type: 'input' }, state)));
        }
      }
      const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };

      // --- action buttons: each tracks its own pointer, so they work while the stick is held
      function bindButton(el) {
        const key = el.dataset.btn;
        let pid = null;
        const press = (e) => {
          e.preventDefault(); if (pid !== null) return; pid = e.pointerId;
          try { el.setPointerCapture(pid); } catch (_) {}
          state[key] = true; el.classList.add('pressed'); buzz(12); send();
        };
        const release = (e) => {
          if (e.pointerId !== pid) return; e.preventDefault(); pid = null;
          state[key] = false; el.classList.remove('pressed'); send();
        };
        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('lostpointercapture', release);
      }
      document.querySelectorAll('[data-btn]').forEach(bindButton);

      // --- analog joystick
      const stick = document.getElementById('stick');
      const knob = document.getElementById('knob');
      const ticks = {};
      ['up', 'down', 'left', 'right'].forEach((d) => { ticks[d] = stick.querySelector('.tick.' + d); });
      const DEAD = 0.22;       // radius fraction ignored entirely
      const H_ON = 0.38;       // |x| needed for left/right
      const V_ON = 0.55;       // |y| needed for jump/crouch (higher, so walking doesn't jump)
      let stickPid = null;
      let lastSent = { ax: 0, ay: 0 };

      function setStick(nx, ny) {
        const mag = Math.hypot(nx, ny);
        let ax = 0, ay = 0;
        if (mag > DEAD) {
          const s = Math.min(1, (mag - DEAD) / (1 - DEAD)) / mag;
          ax = nx * s; ay = ny * s;
        }
        const dirs = {
          left: mag > DEAD && nx < -H_ON, right: mag > DEAD && nx > H_ON,
          up: mag > DEAD && ny < -V_ON, down: mag > DEAD && ny > V_ON,
        };
        let changed = false;
        for (const d in dirs) {
          if (state[d] !== dirs[d]) { state[d] = dirs[d]; changed = true; if (dirs[d]) buzz(6); }
          ticks[d].classList.toggle('on', dirs[d]);
        }
        state.ax = Math.round(ax * 100) / 100; state.ay = Math.round(ay * 100) / 100;
        if (Math.abs(state.ax - lastSent.ax) > 0.08 || Math.abs(state.ay - lastSent.ay) > 0.08) changed = true;
        if (changed) { lastSent = { ax: state.ax, ay: state.ay }; send(); }
      }

      function moveTo(e) {
        const r = stick.getBoundingClientRect();
        const rad = r.width / 2;
        let dx = e.clientX - (r.left + rad), dy = e.clientY - (r.top + rad);
        const max = rad * 0.62;
        const d = Math.hypot(dx, dy);
        if (d > max) { dx *= max / d; dy *= max / d; }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        setStick(dx / max, dy / max);
      }
      function endStick(e) {
        if (e.pointerId !== stickPid) return;
        stickPid = null; stick.classList.remove('active');
        knob.style.transform = 'translate(-50%,-50%)';
        setStick(0, 0);
      }
      stick.addEventListener('pointerdown', (e) => {
        e.preventDefault(); if (stickPid !== null) return;
        stickPid = e.pointerId;
        try { stick.setPointerCapture(stickPid); } catch (_) {}
        stick.classList.add('active'); moveTo(e);
      });
      stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickPid) { e.preventDefault(); moveTo(e); } });
      stick.addEventListener('pointerup', endStick);
      stick.addEventListener('pointercancel', endStick);
      stick.addEventListener('lostpointercapture', endStick);
      document.addEventListener('gesturestart', (e) => e.preventDefault());
      document.addEventListener('contextmenu', (e) => e.preventDefault());

      function connect() {
        statusEl.textContent = 'Connecting…';
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const name = encodeURIComponent(nameInput.value.trim().slice(0, 16));
        ws = new WebSocket(`${proto}://${location.host}/ws?role=controller&name=${name}`);

        ws.onopen = () => { statusEl.textContent = 'Connected — waiting for the game…'; };

        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'assigned') {
            joinEl.style.display = 'none';
            controlsEl.classList.add('active');
            labelEl.textContent = msg.label;
          } else if (msg.type === 'full') {
            statusEl.textContent = 'Lobby is full (6 players max). Try again later.';
          }
        };

        ws.onclose = () => {
          const wasPlaying = controlsEl.classList.contains('active');
          controlsEl.classList.remove('active');
          joinEl.style.display = 'flex';
          statusEl.textContent = wasPlaying
            ? 'Disconnected — tap Connect to reconnect.'
            : 'Could not connect. Tap Connect to retry.';
        };
      }

      joinBtn.addEventListener('click', connect);
    })();
  </script>
</body>
</html>
