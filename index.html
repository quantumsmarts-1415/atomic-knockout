<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomic Knockout</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #07060E;
      height: 100%;
      overflow: hidden;
    }
    #game {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    /* Shown until Title is ready so a cold desktop launch never looks frozen. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1.5rem;
      background: #07060E;
      color: #E8F6FF;
      font-family: Segoe UI, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-align: center;
    }
    #boot-splash strong {
      font-size: 1.35rem;
      color: #F0C14A;
    }
    #boot-splash [data-boot-status] { color: #9ad0ff; font-size: 0.95rem; max-width: 36rem; }
    #boot-splash-detail {
      max-width: 44rem;
      margin: 0;
      color: #ff8fa3;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #boot-splash.is-hidden { display: none; }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-700.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Sora;
      src: url("/fonts/sora-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Sora;
      src: url("/fonts/sora-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Share Tech Mono";
      src: url("/fonts/share-tech-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
  </style>
</head>
<body>
  <div id="boot-splash" aria-live="polite">
    <strong>ATOMIC KNOCKOUT</strong>
    <span data-boot-status>Starting… first launch can take a minute while art loads.</span>
    <pre id="boot-splash-detail" hidden></pre>
  </div>
  <div id="game"></div>
  <script type="importmap">
    {
      "imports": {
        "phaser": "/vendor/phaser.esm.js",
        "qrcode-generator": "/vendor/qrcode.mjs"
      }
    }
  </script>
  <script>
    (function bootGuard() {
      const splash = document.getElementById('boot-splash');
      const status = document.querySelector('[data-boot-status]');
      const detail = document.getElementById('boot-splash-detail');
      function show(msg, err) {
        if (status) status.textContent = msg;
        if (detail && err) {
          detail.hidden = false;
          detail.textContent = err;
        }
      }
      window.__akBootShow = show;
      window.addEventListener('error', (e) => {
        show('Boot error — game scripts failed to start.', String(e.message || e.error || e));
      });
      window.addEventListener('unhandledrejection', (e) => {
        const reason = e.reason && (e.reason.stack || e.reason.message || e.reason);
        show('Boot error — unhandled promise failure.', String(reason || e));
      });
      // Never silently remove the splash. Only Title marks __akUiReady.
      const started = Date.now();
      const tick = () => {
        if (window.__akUiReady) {
          splash?.classList.add('is-hidden');
          return;
        }
        const sec = Math.floor((Date.now() - started) / 1000);
        if (sec === 20 && status && /Starting|Loading art/i.test(status.textContent || '')) {
          status.textContent = (status.textContent || 'Loading…') + ' (still working…)';
        }
        if (sec === 60 && !window.__akBootProgressed) {
          show(
            'Still stuck before the title screen.',
            'If this persists, the Windows build never reached Phaser Boot. Send this message back to the agent.',
          );
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  </script>
  <script type="module">
    try {
      document.querySelector('[data-boot-status]') && (document.querySelector('[data-boot-status]').textContent = 'Loading game code…');
      await import('/src/main.js');
      window.__akBootProgressed = true;
      document.querySelector('[data-boot-status]') && (document.querySelector('[data-boot-status]').textContent = 'Game code loaded — starting renderer…');
    } catch (err) {
      const msg = err && (err.stack || err.message || err);
      if (window.__akBootShow) window.__akBootShow('Failed to load /src/main.js', String(msg));
      else console.error(err);
    }
  </script>
</body>
</html>
