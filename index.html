<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomic Knockout</title>
  <link rel="icon" href="/game.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/build/icon-256.png" />
  <link rel="apple-touch-icon" href="/build/icon-256.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #07060E;
      height: 100%;
      overflow: hidden;
    }
    #game {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-700.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Orbitron;
      src: url("/fonts/orbitron-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Sora;
      src: url("/fonts/sora-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Sora;
      src: url("/fonts/sora-600.woff2") format("woff2");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Share Tech Mono";
      src: url("/fonts/share-tech-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    /* No max-width/max-height rule here on purpose: Phaser's Scale.FIT
       already sets the canvas's own inline width/height to fit #game while
       keeping the 16:9 aspect ratio. A CSS max-width/max-height cap on top
       of that computes independently per axis (no aspect-ratio awareness),
       which can disagree with Phaser's own sizing on some window shapes and
       show up as the canvas looking stretched/zoomed with part of it
       cropped by the viewport edge. Let Phaser own the sizing. */
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="importmap">
    {
      "imports": {
        "phaser": "/node_modules/phaser/dist/phaser.esm.js",
        "qrcode-generator": "/node_modules/qrcode-generator/dist/qrcode.mjs"
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
