# Manual production publish only. Do not enable automatic deploys,
# deploy previews, or branch deploys in the Netlify UI.
# `true` exits 0, which tells Netlify to stop before the build runs,
# so those contexts do not spend build minutes.
#
# The public site is the customer download page (not the in-browser game).
# Host the ~1.5 GB Windows installer on Google Drive (recommended at first),
# then: npm run download:url -- "<share-url>" && npm run build
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  ignore = "true"

[context.branch-deploy]
  ignore = "true"
